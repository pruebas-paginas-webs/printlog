<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141619">
  <meta name="description" content="PrintLog — uso compartido de la impresora 3D: cola, filamento, horas y gastos.">
  <title>PrintLog</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%23e8823c'/%3E%3Ccircle cx='12' cy='12' r='3.4' fill='%23141619'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <p class="marca">PRINTLOG<span class="marca-fase">F4</span></p>
    <div class="topbar-der">
      <span class="estado" id="estado-conexion" data-estado="pendiente">
        <span class="estado-punto" aria-hidden="true"></span>
        <span class="estado-texto" id="estado-texto">…</span>
      </span>
      <button class="chip-icono" id="btn-config" aria-label="Configuración" title="Configuración">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <button class="chip-socio" id="chip-socio" hidden aria-label="Cambiar de socio" title="Cambiar de socio">
        <span class="chip-color" id="chip-color" aria-hidden="true"></span>
        <span class="chip-nombre" id="chip-nombre"></span>
      </button>
    </div>
  </header>

  <main>
    <section class="vista" data-vista="inicio"><div id="cont-inicio"></div></section>
    <section class="vista" data-vista="cola" hidden><div id="cont-cola"></div></section>
    <section class="vista" data-vista="stock" hidden><div id="cont-stock"></div></section>

    <section class="vista" data-vista="stats" hidden><div id="cont-stats"></div></section>

    <section class="vista" data-vista="wishlist" hidden><div id="cont-wishlist"></div></section>
  </main>

  <button class="fab" id="fab" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span id="fab-texto">Nueva</span>
  </button>

  <nav class="tabs" aria-label="Secciones">
    <button class="tab" data-vista="inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 11 8-7 8 7"/><path d="M6.5 9.5V20h11V9.5"/></svg>
      <span>Inicio</span>
    </button>
    <button class="tab" data-vista="cola">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h13"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
      <span>Cola</span>
    </button>
    <button class="tab" data-vista="stock">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="2.6"/></svg>
      <span>Stock</span>
    </button>
    <button class="tab" data-vista="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16"/><path d="M7 20v-6"/><path d="M12 20V6"/><path d="M17 20v-9"/></svg>
      <span>Stats</span>
    </button>
    <button class="tab" data-vista="wishlist">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 4.4 2.3 4.7 5.2.8-3.8 3.6.9 5.1-4.6-2.4-4.6 2.4.9-5.1L4.5 9.9l5.2-.8z"/></svg>
      <span>Wishlist</span>
    </button>
  </nav>

</div>

<!-- Selector de socio (primera vez / cambio) -->
<div class="selector" id="selector" role="dialog" aria-modal="true" aria-labelledby="selector-titulo" hidden>
  <div class="selector-caja">
    <p class="selector-kicker">; printlog · impresora compartida</p>
    <h2 class="selector-titulo" id="selector-titulo">¿Quién sos?</h2>
    <p class="selector-sub">Queda guardado en este teléfono. Lo cambiás cuando quieras tocando tu nombre, arriba a la derecha.</p>
    <div class="selector-lista" id="selector-lista"></div>
  </div>
</div>

<!-- Overlay reutilizable: modales, action sheets y confirmaciones se inyectan acá -->
<div class="overlay" id="overlay" hidden></div>

<!-- Toasts -->
<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
